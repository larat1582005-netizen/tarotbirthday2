<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stars Have a Message</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<button id="mute" class="icon-btn" aria-label="Toggle music" hidden>♪</button>

<main>
  <section id="welcome" class="screen active">
    <div class="moon" aria-hidden="true"><i></i></div>
    <h1>The Universe Has a Message for You</h1>
    <p class="who"><span id="name"></span><br><small id="bday"></small></p>
    <button class="cta" id="begin">Discover Your Destiny</button>
  </section>

  <section id="intro" class="screen">
    <div class="phases" aria-hidden="true">🌑 🌒 🌓 🌔 🌕 🌖 🌗 🌘</div>
    <p class="mystic">Another year, another chapter written in the stars.<br>Tonight, the cards are yours.</p>
    <button class="cta" id="toCards">Approach the Cards</button>
  </section>

  <section id="table" class="screen">
    <h2 id="hint">Choose a card. Let it choose you.</h2>
    <div id="deck"></div>
    <article id="reading" aria-live="polite"></article>
    <button class="cta" id="next" hidden>Turn the Next Card</button>
  </section>

  <section id="final" class="screen">
    <h2 class="happy" id="happy">Happy Birthday, Beautiful Soul.</h2>
    <div class="letter" id="letter"></div>
    <div id="surprise"></div>
    <button class="cta" id="reveal">Reveal the Final Card</button>
    <button class="ghost" id="again">Read the cards again</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
